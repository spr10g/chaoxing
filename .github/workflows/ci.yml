name: Windows tests and build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/ui_layout.py
      - name: Build desktop bundle
        shell: pwsh
        run: ./scripts/build.ps1 -Python python
      - uses: actions/upload-artifact@v7
        with:
          name: chaoxing-desktop-windows-x64
          path: dist/ChaoxingDesktop-*/
